[package]
name = "chr-factors"
version.workspace = true
edition.workspace = true
[features]
default = ["metrics"]
metrics = ["chr-persistent/metrics", "chr-observe/metrics", "chr-compiled?/metrics"]
lifecycle = ["dep:chr-compiled"]
worker-lowering = ["lifecycle", "chr-compiled/carrier-contraction"]

[dependencies]
chr-syntax = { path = "../../crates/chr-syntax" }
chr-observe = { path = "../chr-observe", default-features = false }
chr-persistent = { path = "../chr-persistent", default-features = false }
chr-compiled = { path = "../chr-compiled", default-features = false, optional = true }
[dev-dependencies]
chr-cases = { path = "../chr-cases" }
chr-reference = { path = "../../crates/chr-reference" }

[[example]]
name = "region_lifecycle"
required-features = ["lifecycle"]

[[example]]
name = "region_lifecycle_memory"
required-features = ["lifecycle"]

[[example]]
name = "worker_lowering_gate"
required-features = ["worker-lowering"]

[[example]]
name = "worker_lowered_cost"
required-features = ["worker-lowering"]

[[example]]
name = "worker_lowered_allocation"
required-features = ["worker-lowering"]
