[package]
name = "chr-compiled"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
default = ["metrics"]
metrics = ["chr-persistent/kernel-metrics", "chr-observe/metrics"]
experiment = []
carrier-contraction = []
fork-diagnostics = ["chr-persistent/fork-diagnostics"]
arena-cow = ["chr-persistent/arena-cow"]
alloc-meter = ["experiment"]

[[bin]]
name = "chr-compiled-cost"
path = "experiments/main.rs"
required-features = ["experiment"]

[dependencies]
chr-syntax = { path = "../../crates/chr-syntax" }
chr-persistent = { path = "../chr-persistent", default-features = false }
chr-observe = { path = "../chr-observe", default-features = false }

[build-dependencies]
chr-syntax = { path = "../../crates/chr-syntax" }

[dev-dependencies]
chr-cases = { path = "../chr-cases" }

[[bin]]
name = "chr-state-preservation-cost"
path = "experiments/state_preservation.rs"
required-features = ["experiment"]
