[package]
name = "chr-compiled"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
default = ["metrics"]
metrics = ["chr-persistent/kernel-metrics"]
experiment = []
alloc-meter = ["experiment"]

[[bin]]
name = "chr-compiled-cost"
path = "experiments/main.rs"
required-features = ["experiment"]

[dependencies]
chr-syntax = { path = "../../crates/chr-syntax" }
chr-persistent = { path = "../chr-persistent", default-features = false }
chr-observe = { path = "../chr-observe" }

[build-dependencies]
chr-syntax = { path = "../../crates/chr-syntax" }
