version: 2
goal:
  title: CHR shared-execution research
  slug: chr-sharing
  kind: existing_plan
  tranche: 'M1: jointly investigate language design and execution architecture; review evidence and tradeoffs before prototypes.'
  status: active
  oracle:
    signal: Reviewed dossier maps C01-C06 to evidence or gaps and explains actively discovered language/execution proposals and their tradeoffs.
    cadence: At each research receipt and M1 review.
    final_proof: M1 review verifies semantic and mechanism coverage, independent opportunity discovery, language costs, evidence limits, and justified next steps; no implementation completion is claimed.
  intake:
    original_request: This is a research project that needs proper management.
    interpreted_outcome: Execute M1 joint language and architecture investigation and return reviewed findings and research gaps.
    input_shape: existing_plan
    audience: Project owner and future implementers
    authority: approved
    proof_type: artifact
    completion_proof: Reviewed source-backed dossier, coverage record, language-design tradeoffs, and justified next steps.
    likely_misfire: Mistaking plausible examples, compact representation, or completed paperwork for evidence supporting an architecture.
    blind_spots_considered:
      - Nonconfluent schedules cannot be validated against one fixed result.
      - Query operations and residual-answer projection remain open.
      - Storage sharing does not establish shared computation or net speed.
      - A survey confined to a fixed language or owner-supplied examples misses language/architecture opportunities.
    existing_plan_facts:
      - Use S01-S09 as the current baseline; proactively investigate language-design changes with explicit semantics and owner-facing tradeoff reports.
      - Survey mechanisms before candidate selection.
      - Design evaluations before measurements.
      - Review at M1-M4 boundaries.
  execution_started: true
  preparation_status: reviewed
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
visual_board:
  selected: local
  local:
    status: live
    url: http://goalbuddy.localhost:41737/chr-sharing/
    command: node /home/ahart/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/chr-sharing
active_task: T011
tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    objective: Prepare research charter and investigation protocol.
    inputs:
      - Owner conversation decisions
    constraints:
      - No evaluator implementation or experiments.
      - Preserve S01-S09; escalate only material semantic choices.
    expected_output:
      - goal.md
      - notes/investigation-protocol.md
    receipt:
      result: done
      summary: Drafted contract S01-S09, open questions O01-O07, claims C01-C05, milestones, and investigation protocol.
      evidence:
        - goal.md
        - notes/investigation-protocol.md
      limitations:
        - No literature dossier or architecture result.
  - id: T002
    type: judge
    assignee: Judge
    status: done
    objective: Audit preparation against owner decisions and experimental validity.
    inputs:
      - goal.md
      - notes/investigation-protocol.md
      - Owner conversation
    constraints:
      - No evaluator implementation or experiments.
      - Preserve S01-S09; escalate only material semantic choices.
    expected_output:
      - Substantive issues and corrections
      - Preparation review receipt
    receipt:
      result: done
      decision: preparation_reviewable
      summary: Independent review and PM audit completed; explicit-alternative preservation and bounded search checkpoints incorporated.
      note: notes/preparation-review.md
      full_outcome_complete: false
      limitations:
        - Research has not started.
        - No feasibility or performance conclusion.
  - id: T003
    type: scout
    assignee: Scout
    status: done
    objective: Discover and investigate language-design and execution opportunities together, with semantic and literature evidence.
    inputs:
      - goal.md
      - notes/investigation-protocol.md
    constraints:
      - No evaluator implementation or experiments.
      - Actively investigate candidate language changes; retain explicit baseline/candidate distinctions and bring reasoned proposals to the owner.
      - Execution authorized on 2026-09-06; parallel read-only research scopes cover CHR, interaction nets, functional logic, and conditional stores.
      - Follow protocol search and coverage rules; do not select architecture from seed references.
      - Start with the bounded retrieval and citation pass in protocol section 2, then report a coverage checkpoint.
    expected_output:
      - Source ledger with queries, locators, assumptions, and limitations
      - Semantic dossier and unresolved owner decisions
      - Mechanism coverage and candidate inclusion/exclusion rationale
      - Language-choice/execution-opportunity map and owner-facing proposals with expressiveness, programming, and implementation tradeoffs
    receipt:
      result: done
      summary: Completed first bounded four-stream research pass; inspected primary semantics/mechanisms and pinned HVM4 source, with six language-design opportunities and explicit transfer gaps.
      evidence:
        - notes/T003-research-findings.md
        - notes/T003-chr-semantics.md
        - notes/T003-interaction-nets.md
        - notes/T003-functional-logic.md
        - notes/T003-conditional-execution.md
      limitations:
        - Coverage not saturated; first-20 attribution incomplete for merged queries.
        - No complete reference oracle, CHR sharing proof, or project benchmark.
      harness: codex
  - id: T004
    type: judge
    assignee: Judge
    status: done
    objective: Review M1 evidence and define the justified next investigation.
    inputs:
      - T003 receipt and dossier
      - C01-C06 evidence mapping
    constraints:
      - No evaluator implementation or experiments.
      - Actively investigate candidate language changes; retain explicit baseline/candidate distinctions and bring reasoned proposals to the owner.
      - Do not activate prototype work; M2 requires a reviewed evaluation design.
    expected_output:
      - Coverage and semantic review
      - Evidence gaps and decision request
      - M2 scope if justified
      - Audit active opportunity discovery beyond supplied examples and validity of semantic/performance comparisons
    receipt:
      result: done
      decision: checkpoint_reviewable
      full_outcome_complete: false
      summary: Cross-stream review found no substantive transfer overclaim; coverage remains open. Next-pass priorities need explicit rationale and must retain competing mechanisms.
      limitations:
        - Reviewer authored interaction-net evidence; not independent verification of that stream.
        - M1 coverage stopping condition unmet.
  - id: T005
    type: pm
    assignee: PM
    status: done
    objective: Make joint language and architecture discovery an explicit research responsibility.
    inputs:
      - Owner clarification on active language-design investigation
    constraints:
      - No baseline semantic changes adopted.
    expected_output:
      - Consistent charter, protocol, and M1 task obligations
    receipt:
      result: done
      summary: Added proactive opportunity discovery, candidate semantic comparisons, programming-cost evaluation, and review requirements.
      evidence:
        - goal.md
        - notes/investigation-protocol.md
      limitations:
        - Research findings and candidate recommendations remain future work.
  - id: T006
    type: scout
    assignee: Scout
    status: done
    objective: Resolve priority transfer and coverage gaps across competing mechanisms in a second bounded pass.
    inputs:
      - T003 evidence
      - T004 review
    constraints:
      - Read-only research; no prototype.
      - Trace exact sources and assumptions; retain conditional execution, memoized graph sharing, and local-net candidates.
    expected_output:
      - Targeted semantic and scheduling findings
      - Citation-expansion and unresolved-gap record
    receipt:
      result: done
      summary: Resolved token-aware disjunction reference and investigated fairness, context dependencies, compiler reuse, richer nets, and learned consequences.
      evidence:
        - notes/T006-transfer-findings.md
        - notes/T006-source-record.md
      limitations:
        - Coverage not saturated; ranked retrieval remains incomplete in the CHR stream.
        - No project semantics proof, implementation, or performance measurements.
  - id: T007
    type: judge
    assignee: Judge
    status: done
    objective: Audit M1 dossier and justify the next phase or precise remaining research.
    inputs:
      - T003 and T006 evidence
    constraints:
      - No architecture adoption or prototype authorization by default.
    expected_output:
      - Claim/evidence assessment
      - Coverage verdict and next-step rationale
    receipt:
      result: done
      decision: checkpoint_reviewable
      summary: 'Cross-stream review found one scope correction: candidates may explicitly exclude the common case under stated language restrictions and reformulation costs. Incorporated.'
      evidence:
        - notes/T007-review.md
      full_outcome_complete: false
      limitations:
        - Reviewer authored functional-logic evidence; not independent source certification of that stream.
        - M1 stopping condition remains unmet.
  - id: T008
    type: scout
    assignee: Scout
    status: done
    objective: Specify comparable baseline and candidate semantics and eligibility conditions.
    inputs:
      - T006 findings and T007 review
      - notes/intended-programs.md
    constraints:
      - No architecture selection or prototype.
      - Treat excluded programs and reformulation costs explicitly; allow multi-step correspondence.
      - Do not invent owner decisions on query operations or residual-answer interface.
    expected_output:
      - Duplicate-preserving reference adaptation and unresolved semantic choices
      - Candidate-specific semantics, enabling properties and shared-work obligations
      - Expressibility and correctness analysis of the common conditional-lifetime case
    receipt:
      result: done
      summary: Drafted baseline reference adaptation, candidate contracts, programming costs, shared-work obligations and hand-derived counterexample traces.
      evidence:
        - notes/T008-reference-and-candidates.md
        - notes/T008-worked-obligations.md
      limitations:
        - Proposed specification, not a full formalization or representation proof.
        - Owner choices on additional primitives and answer/query interfaces remain open.
  - id: T009
    type: scout
    assignee: Scout
    status: done
    objective: Complete targeted forward-citation and coverage expansion with attributable result logs.
    inputs:
      - T003 and T006 source records
    constraints:
      - Checkpoint each bounded round.
      - Do not infer saturation from repeated retrieval of familiar families.
    expected_output:
      - Forward-citation ledger and coverage verdict
      - Inclusion or exclusion reasons for remaining relevant mechanism leads
    receipt:
      result: done
      summary: Completed two bounded forward/author expansion rounds with ranked ledgers and primary-source analysis; assessed sampled-family stability and remaining global coverage gaps.
      evidence:
        - notes/T009-coverage.md
      limitations:
        - Global saturation remains unestablished.
        - No CHR transfer theorem or project measurement obtained.
  - id: T010
    type: judge
    assignee: Judge
    status: done
    objective: Review comparative reference, eligibility costs and coverage verdict.
    inputs:
      - T008 and T009 artifacts
      - Owner intended programs
    constraints:
