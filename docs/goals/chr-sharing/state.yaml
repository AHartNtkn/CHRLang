version: 2
goal:
  title: CHR shared-execution research
  slug: chr-sharing
  kind: existing_plan
  tranche: Joint language and execution research across all live directions; experiment readiness does not close the broader objective.
  status: active
  oracle:
    signal: Reviewed dossier maps C01-C06 to evidence or gaps and explains actively discovered language/execution proposals and their tradeoffs.
    cadence: At each research receipt and M1 review.
    final_proof: Direction-by-direction audit of every live question, supported disposition and evidence; no independent analytical or source work remains actionable.
  intake:
    original_request: This is a research project that needs proper management.
    interpreted_outcome: Thoroughly investigate all relevant language-design and execution directions, including alternatives to the most-developed candidate. Continue every research question that can make meaningful progress without implementation or an owner decision. Stop only after a direction-by-direction evidence audit shows that every remaining relevant question requires specific implementation results unavailable through reasonable further analysis or sources, requires a specific owner decision, or is sufficiently investigated to close. Candidate or milestone readiness is not goal completion.
    input_shape: existing_plan
    audience: Project owner and future implementers
    authority: approved
    proof_type: artifact
    completion_proof: Reviewed source-backed dossier, coverage record, language-design tradeoffs, and justified next steps.
    likely_misfire: Treating readiness of the most-developed experiment as a dependency or stopping condition for independent research on other directions.
    blind_spots_considered:
      - Nonconfluent schedules cannot be validated against one fixed result.
      - Query operations and residual-answer projection remain open.
      - Storage sharing does not establish shared computation or net speed.
      - A survey confined to a fixed language or owner-supplied examples misses language/architecture opportunities.
    existing_plan_facts:
      - Use S01-S09 as the current baseline; proactively investigate language-design changes with explicit semantics and owner-facing tradeoff reports.
      - Survey mechanisms before candidate selection.
      - Design evaluations before measurements.
      - Review at M1-M4 boundaries.
    latest_objective: Thoroughly investigate all relevant language-design and execution directions, including alternatives to the most-developed candidate. Continue every research question that can make meaningful progress without implementation or an owner decision. Stop only after a direction-by-direction evidence audit shows that every remaining relevant question requires specific implementation results unavailable through reasonable further analysis or sources, requires a specific owner decision, or is sufficiently investigated to close. Candidate or milestone readiness is not goal completion.
  execution_started: true
  preparation_status: reviewed
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
visual_board:
