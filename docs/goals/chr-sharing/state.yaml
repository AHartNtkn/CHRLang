    expected_output:
      - Substantive corrections and next-work rationale
    receipt:
      result: done
      decision: comparative_checkpoint_reviewable
      full_outcome_complete: false
      summary: Corrected identity freshness, substitution composition and liveness scope. Comparison is reviewable; M1 proof/eligibility and broader coverage gaps remain.
      evidence:
        - notes/T010-comparison-review.md
      limitations:
        - Reviewer contributed candidate analysis; not fully independent authorship.
  - id: T011
    type: scout
    assignee: Scout
    status: active
    objective: Resolve specific representation and eligibility obligations and source gaps needed for M1 closure.
    inputs:
      - notes/T008-reference-and-candidates.md
      - notes/T008-worked-obligations.md
      - notes/T009-coverage.md
      - notes/T010-comparison-review.md
    constraints:
      - No prototype or architecture adoption.
      - Produce proof arguments, counterexamples or precise unresolved obligations.
      - Do not require baseline expressibility from a candidate that declares a semantic restriction.
    expected_output:
      - Conditional substitution and occurrence-update analysis
      - Sufficient dependency and local-net eligibility conditions
      - Declared interfaces for solver reuse
      - Source-gap disposition and M1 gate review
