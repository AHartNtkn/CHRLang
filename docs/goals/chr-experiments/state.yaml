version: 2
goal:
  title: CHR experimental investigation
  slug: chr-experiments
  kind: existing_plan
  tranche: Continuous investigation across all relevant language and execution directions.
  status: active
  execution_authority: Redesigned goal authorizes implementation and experiments selected under R00 and the governing sequence.
  governing_sequence: docs/experiments/sequence.md
  question_map: docs/experiments/coverage.md
  current_research: S00 contracts and first-cycle feasibility assessed; S01 direct/retained source gates pass with selective/consuming and lifecycle work open; S03 direct graph passes kernel/equality checks, 40 finite source configurations and finite-sibling publication; credible compiled controls and lifecycle comparison remain open. Architecture questions remain unresolved.
  oracle:
    signal: Discriminating evidence supports architecture and language decisions across efficiency, necessary complexity and explicit tradeoffs.
    cadence: After each experimental package and at cross-family review.
    final_proof: Every relevant question has evidence, limits, plausible follow-ups and justified disposition; no feasible
      materially useful work remains.
  intake:
    original_request: Run experiments until all reasonably useful learning for the CHR project is exhausted.
    interpreted_outcome: Implement and investigate the experimental portfolio, expand it when evidence warrants, and support
      language/execution decisions without prematurely selecting one architecture.
    input_shape: existing_plan
    audience: Project owner
    authority: approved
    proof_type: metric
    completion_proof: Receipt-backed comparative findings and full question audit.
    likely_misfire: Refining named mechanisms without evidence that the results can change an architectural decision.
    blind_spots_considered:
      - Reference agreement alone is not correctness.
      - Weak copying baselines can exaggerate benefits.
      - Nonground synthesis and active failure must remain observable.
    existing_plan_facts:
      - docs/experiments/sequence.md
      - docs/experiments/coverage.md
      - Redesigned experimental execution is authorized; selection follows architectural decision value.
      - Language adoption remains owner-dependent.
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: missing
  worker: missing
  judge: missing
visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: null
